# The project Docker compose file for development.

services:
  geoportal:
    environment:
      - TEST=%
      - test=1234
      # Authentication secret used by the acceptance tests (see also the tools service below),
      # the same value must be set in both services.
      - C2C_SECRET=c2c-ci-test-secret
    volumes:
      - ./geoportal/ci/:/app/ci/

  qgisserver:
    extends:
      file: docker-compose-lib.yaml
      service: qgisserver
    volumes_from:
      - config:ro
    environment:
      # Single QGIS project files
      - QGIS_PROJECT_FILE=/etc/qgisserver/project.qgz
      - GEOMAPFISH_OGCSERVER=mapserver
      - QGIS_SERVER_LOG_LEVEL=0

  tools:
    volumes_from:
      - config:rw
    environment:
      # Same secret as the geoportal service, read by the acceptance tests
      - C2C_SECRET=c2c-ci-test-secret

  db:
    extends:
      file: docker-compose-lib.yaml
      service: db
    ports:
      - 54321:5432
    volumes:
      - postgresql_data:/var/lib/postgresql
      - ./ci/test-app-db:/docker-entrypoint-initdb.d

  externaldb:
    extends:
      file: docker-compose-lib.yaml
      service: db
    environment:
      POSTGRES_PASSWORD: www-data
      POSTGRES_USER: www-data
      POSTGRES_DB: test
    volumes:
      - ./ci/test-external-db:/docker-entrypoint-initdb.d
