---
name: Continuous integration

on:
  push:

permissions:
  contents: read
  # To publish the images to be used on Kubernetes
  # packages: write
  # id-token: write

jobs:
  main:
    runs-on: ubuntu-22.04
    name: Continuous integration
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: echo "${HOME}/.local/bin" >> ${GITHUB_PATH}
      - run: python3 -m pip install --user --requirement=ci/requirements.txt

      - name: Checks
        run: c2cciutils-checks

      - name: Build
        run: ./build --docker-compose-version-2

      # To publish the images to be used on Kubernetes
      # `tag-publish` comes from the `.github/publish` uv project of the checked out branch, with
      # its dependencies fully locked, instead of the `ci/requirements.txt` of that branch.
      # - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      #   with:
      #     version: latest-known
      #     cache-python: true
      #     python-version: '3.11'
      # - name: Publish
      #   run: uv run --locked --isolated --project=.github/publish tag-publish
