---
name: Continuous integration

on:
  push:

permissions:
  contents: read
  # To publish the images to be used on Kubernetes
  # packages: write
  # id-token: write

jobs:
  main:
    runs-on: ubuntu-24.04
    name: Continuous integration
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python3 -m pip install --requirement=ci/requirements.txt
      - name: Environment information
        run: c2cciutils-env

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{'{{'}} hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{'{{'}} hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch || true
        if: failure()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      # Can be used to have some secrets (with mask)
      # - run: make secrets
      # - run: cat env.secrets |grep '^[# A-Z0-9_]\+='|sed -e 's/^[# A-Z0-9_]\+=\(.*\)/::add-mask::\1/g'

      # - name: Initialize the acceptance tests
      #   run: make acceptance-init
      # - run: c2cciutils-docker-logs
      #   if: always()

      # - name: Run the acceptance tests
      #   run: make acceptance
      # - run: c2cciutils-docker-logs
      #   if: always()

      - name: Build
        run: ./build

      - name: Application checks
        run: make checks

      # To publish the images to be used on Kubernetes
      # `tag-publish` comes from the `.github/publish` uv project of the checked out branch, with
      # its dependencies fully locked, instead of the `ci/requirements.txt` of that branch.
      # - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      #   with:
      #     version: latest-known
      #     cache-python: true
      #     python-version: '3.14'
      # - name: Publish
      #   run: >
      #     uv run --locked --isolated --project=.github/publish tag-publish
      #  env:
      #    GITHUB_TOKEN: ${{'{{'}} secrets.GITHUB_TOKEN }}
