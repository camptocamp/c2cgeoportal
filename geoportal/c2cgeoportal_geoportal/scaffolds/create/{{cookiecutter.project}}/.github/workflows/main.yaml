---
name: Continuous integration

on:
  push:

permissions:
  contents: read
  # To publish the images to be used on Kubernetes
  # packages: write
  # id-token: write

jobs:
  main:
    runs-on: ubuntu-24.04
    name: Continuous integration
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -m pip install --requirement=ci/requirements.txt
      - name: Environment information
        run: c2cciutils-env

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{'{{'}} hashFiles('.pre-commit-config.yaml') }}
          restore-keys: "pre-commit-${{'{{'}} hashFiles('.pre-commit-config.yaml') }}\npre-commit-"
      - run: pre-commit run --all-files --config=.pre-commit-config.yaml
      - run: git diff --exit-code --patch > /tmp/pre-commit.patch || true
        if: failure()
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Apply pre-commit fix.patch
          path: /tmp/pre-commit.patch
          retention-days: 1
        if: failure()

      # Can be used to have some secrets (with mask)
      # - run: make secrets
      # - run: cat env.secrets |grep '^[# A-Z0-9_]\+='|sed -e 's/^[# A-Z0-9_]\+=\(.*\)/::add-mask::\1/g'

      # - name: Initialize the acceptance tests
      #   run: make acceptance-init
      # - run: c2cciutils-docker-logs
      #   if: always()

      # - name: Run the acceptance tests
      #   run: make acceptance
      # - run: c2cciutils-docker-logs
      #   if: always()

      - name: Build
        run: ./build

      - name: Application checks
        run: make checks

      # To publish the images to be used on Kubernetes
      # - name: Publish
      #   run: tag-publish
      #  env:
      #    GITHUB_TOKEN: ${{'{{'}} secrets.GITHUB_TOKEN }}
