---
name: Update l10n cron job

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l10n:
    runs-on: ubuntu-26.04
    name: Update l10n cron job
    timeout-minutes: 10
    # The translations are read from the running instance, set the `PROJECT_PUBLIC_URL` repository
    # variable to the public URL of the project to enable this job.
    if: vars.PROJECT_PUBLIC_URL != ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: ./build --env
      - run: PROJECT_PUBLIC_URL=${{'{{'}} vars.PROJECT_PUBLIC_URL {{'}}'}} make -e update-po-from-url

      # The job fails when the translations changed, the `patch` module of ghci picks the artifact up,
      # commits it on this branch and opens the pull request, no personal access token is needed here.
      - run: git add --all
      - run: git diff --staged --exit-code
        id: diff
      - run: git diff --staged --patch > /tmp/Update-the-l10n-files.patch
        if: failure() && steps.diff.outcome == 'failure'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update the l10n files.patch
          path: /tmp/Update-the-l10n-files.patch
          retention-days: 1
        if: failure() && steps.diff.outcome == 'failure'
