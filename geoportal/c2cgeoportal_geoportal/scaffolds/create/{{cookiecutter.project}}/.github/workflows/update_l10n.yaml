---
name: Update l10n cron job

on:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read

jobs:
  l10n:
    runs-on: ubuntu-26.04
    name: Update l10n cron job
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: int-{{cookiecutter.geomapfish_main_version_dash}}
            base_url: int.customer.ch
          - branch: prod-{{cookiecutter.geomapfish_main_version_dash}}
            base_url: prod.customer.ch

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{'{{'}} matrix.branch {{'}}'}}

      - run: ./build --env
      - run: PROJECT_PUBLIC_URL=${{'{{'}} matrix.base_url {{'}}'}} make -e update-po-from-url

      # The job fails when the translations changed. The `patch` module of ghci picks the artifact up,
      # applies it on the branch carried by its name and opens the pull request, so no personal access
      # token is needed here anymore.
      - run: sudo chown -R $(id -u) .
      - run: git add --all
      - run: git diff --staged --exit-code
        id: diff
      - run: git diff --staged --patch > /tmp/Update-the-l10n-files.patch
        if: failure() && steps.diff.outcome == 'failure'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update the l10n files on ${{'{{'}} matrix.branch {{'}}'}} [${{'{{'}} matrix.branch {{'}}'}}].patch
          path: /tmp/Update-the-l10n-files.patch
          retention-days: 1
        if: failure() && steps.diff.outcome == 'failure'
