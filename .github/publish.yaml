# yaml-language-server: $schema=https://raw.githubusercontent.com/camptocamp/tag-publish/1.3.3/tag_publish/schema.json

docker:
  images:
    - name: camptocamp/geomapfish
    - name: camptocamp/geomapfish-config
    - name: camptocamp/geomapfish-tools
    - name: camptocamp/geomapfishapp-geoportal
    # 2.7
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.22
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28-gdal3.6
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28-gdal3.7
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgisltr
    # 2.8
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28-gdal3.6
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28-gdal3.7
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-old
      tags:
        - gmf{version}-qgis3.28
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-3.34-gdal3.7
      tags:
        - gmf{version}-qgis3.34-gdal3.7
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-latest
      tags:
        - gmf{version}-qgislatest
    # 2.9
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-3.44-gdal3.10
      tags:
        - gmf{version}-qgis3.44-gdal3.10
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-3.44
      tags:
        - gmf{version}-qgis3.44
    # master
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-4.2-gdal3.13
      tags:
        - gmf{version}-qgis4.2-gdal3.13
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-4.2
      tags:
        - gmf{version}-qgis4.2
    # all versions
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-ltr
      tags:
        - gmf{version}-qgisltr
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-lr
      tags:
        - gmf{version}-qgislr
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-lr-debug
      tags:
        - gmf{version}-qgislr-debug
    - name: camptocamp/geomapfish-qgisserver
      group: qgis-master
      tags:
        - gmf{version}-qgismaster
pypi:
  versions_type:
    - version_tag
  packages:
    # The wheels are built by the `main` job and given to the `publish` job as an artifact, hence
    # the no-op build command: the publishing job must not install a build toolchain.
    - folder: commons
      group: pypi
      build_command:
        - /bin/echo
        - The wheels are provided as a CI artifact
    - folder: geoportal
      group: pypi
      build_command:
        - /bin/echo
        - The wheels are provided as a CI artifact
    - folder: admin
      group: pypi
      build_command:
        - /bin/echo
        - The wheels are provided as a CI artifact
