name: Update ngeo 2.10

on:
  repository_dispatch:
    types:
      - ngeo_2.10_updated
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    name: Update ngeo 2.10
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    env:
      PRE_COMMIT_HOME: /home/runner/.cache/pre-commit
      MAIN_BRANCH: '2.10'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.MAIN_BRANCH }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python3 -m pip install '--only-binary=:all:' --requirement=ci/requirements.txt

      - run: npm update --ignore-scripts
        working-directory: geoportal

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ env.MAIN_BRANCH }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ env.MAIN_BRANCH }}-${{ hashFiles('.pre-commit-config.yaml') }}
            pre-commit-${{ env.MAIN_BRANCH }}-
      # The npm-lock hook normalizes the lock file updated by `npm update`, and reports the
      # modification as a failure, which is the expected outcome here, not an error.
      - run: pre-commit run --all-files
        continue-on-error: true

      - run: git add --all
      # Fail on purpose when there is a change so that the GHCI patch module applies the uploaded
      # patch on the stabilization branch in a pull request that is auto-merged by the CI checks.
      - id: diff
        run: git diff --staged --exit-code
      - run: git diff --staged --patch > /tmp/update-ngeo.patch
        if: failure() && steps.diff.outcome == 'failure'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Update used ngeo [${{ env.MAIN_BRANCH }}].patch
          path: /tmp/update-ngeo.patch
          retention-days: 1
        if: failure() && steps.diff.outcome == 'failure'
