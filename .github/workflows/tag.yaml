name: Reset 4th version on tag

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  common:
    runs-on: ubuntu-26.04
    name: Reset 4th version on tag
    timeout-minutes: 30
    if: "!startsWith(github.event.head_commit.message, '[skip ci] ')"

    steps:
      # Previously configured by the removed gopass action, still required by the version push.
      - name: Configure Git
        run: |
          git config --global user.email "geospatial-bot@camptocamp.com"
          git config --global user.name "CI"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: scripts/get-main-version --github
        id: main-version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.main-version.outputs.main_branch }}

      - run: scripts/get-version --auto-increment

      - name: Push version
        run: |
          set -eux
          git add ci/ci.yaml
          git diff --staged --quiet || (\
            git commit -m "[skip ci] Update the minor version"; \
            git push origin HEAD:${{ steps.main-version.outputs.main_branch }} \
          )
